# Deploys the site to GitHub Pages.
#
# Per Factor XIX (Deploy Tags, Not Branches), this workflow fires on version
# tags - pushing to main builds nothing and deploys nothing. Cut a release with:
#
#   git tag -a v0.2.0 -m "what changed"
#   git push origin v0.2.0
#
# workflow_dispatch is kept as the human-in-the-loop escape hatch (Factor XX).

name: deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install (not ci) until a package-lock.json is committed;
      # commit the lockfile after the first local install to pin builds.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
